plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'kotlin-kapt'

}

android {
    namespace 'com.syspolrer.systemfileexplorer'
    compileSdk 34

    defaultConfig {
        applicationId "com.syspolrer.systemfileexplorer"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue "string", "str_ads_google_app_id", "ca-app-pub-4824353242373249~3839716541"
            resValue "string", "str_ads_banner", "ca-app-pub-4824353242373249/6434090290"
            resValue "string", "str_ads_interstitial", "ca-app-pub-4824353242373249/2494845284"
            resValue "string", "str_ads_open", "ca-app-pub-4824353242373249/1181763616"
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue "string", "str_ads_google_app_id", "ca-app-pub-3940256099942544~3347511713"
            resValue "string", "str_ads_banner", "ca-app-pub-3940256099942544/6300978111"
            resValue "string", "str_ads_interstitial", "ca-app-pub-3940256099942544/1033173712"
            resValue "string", "str_ads_open", "ca-app-pub-3940256099942544/9257395921"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }


    buildFeatures{
        dataBinding true
    }
    lintOptions {
        checkReleaseBuilds true
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
        disable 'ContentDescription'

    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'org.apache.commons:commons-io:1.3.2'
    implementation 'com.github.bumptech.glide:glide:4.14.2'
    kapt 'com.github.bumptech.glide:ksp:4.14.2'
    implementation ('com.github.bumptech.glide:recyclerview-integration:4.14.2') {
        // Excludes the support library because it's already included by Glide.
        transitive = false
    }

    //gson
    implementation 'com.google.code.gson:gson:2.11.0'


    implementation 'com.tuyenmonkey:mkloader:1.4.0'
    implementation 'com.squareup.picasso:picasso:2.8'

    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.23'

    implementation 'com.jaredrummler:android-processes:1.0.3'

    implementation 'com.afollestad.material-dialogs:core:0.9.6.0'

    //ads
    implementation 'com.google.android.gms:play-services-ads:23.1.0'
}